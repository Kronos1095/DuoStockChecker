<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>NYC Stock Watch</title><style>body{font:16px system-ui;background:#0c1020;color:#f4f6ff;margin:0;padding:24px;max-width:760px;margin:auto}h1{font-size:32px}header,.panel{background:#171d32;border:1px solid #303955;border-radius:18px;padding:22px;margin-bottom:16px}.sub{color:#a9b3cf}.store{padding:13px 0;border-bottom:1px solid #303955;display:flex;justify-content:space-between;gap:15px}.yes{color:#5ce7a0}.no{color:#a9b3cf}.error{color:#ffb17b}a{color:#99bdff}button{background:#4169df;color:white;padding:12px 16px;border:0;border-radius:10px;font-weight:700}</style></head><body><header><div class="sub">NYC STOCK WATCH</div><h1>iPhone Duo</h1><p>Star White · 256GB · NYC Apple Stores</p><a href="https://www.apple.com/shop/buy-iphone/iphone-duo">Buy on Apple ↗</a></header><section class="panel"><h2 id="health">Loading status…</h2><p id="detail" class="sub"></p><button onclick="load()">Refresh dashboard</button></section><section class="panel"><h2>Stores</h2><div id="stores" class="sub">Waiting for first scan.</div></section><p class="sub">Unofficial stock tracker. Checks run on GitHub Actions; a browser refresh does not trigger a new Apple check. Availability can change before checkout.</p><script>async function load(){try{let r=await fetch('status.json?ts='+Date.now());if(!r.ok)throw Error('No published status yet');let d=await r.json();document.getElementById('health').textContent=d.health==='ok'?'Monitor online':d.health==='setup_required'?'Setup required':'Monitor error';document.getElementById('detail').textContent=d.message+' · Last run: '+new Date(d.updated).toLocaleString();document.getElementById('stores').innerHTML='';for(let s of d.stores||[]){let row=document.createElement('div');row.className='store';let name=document.createElement('span');name.textContent=s.name;let status=document.createElement('strong');status.className=s.status==='available'?'yes':'no';status.textContent=s.status==='available'?'AVAILABLE':'Unavailable';row.append(name,status);document.getElementById('stores').append(row)}if(!(d.stores||[]).length)document.getElementById('stores').textContent='No validated inventory results yet.'}catch(e){document.getElementById('health').textContent='Not published';document.getElementById('detail').textContent=e.message}}load();setInterval(load,60000)</script></body></html>
