name: Check all retailers
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      BESTBUY_API_KEY:
        required: false
      NTFY_TOPIC:
        required: false
  push:
    paths:
      - '**.py'
      - '.github/workflows/**'
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
jobs:
  stock:
    concurrency:
      group: stock-publish-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reliability tests
        run: python -m unittest discover -s tests -v
      - name: Check all retailers concurrently
        env:
          APPLE_PART_NUMBER: ${{ vars.APPLE_PART_NUMBER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python run_all.py
      - name: Publish fresh status
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/status.json
          if [ -f docs/att-status.json ]; then git add docs/att-status.json; fi
          if [ -f docs/bestbuy-status.json ]; then git add docs/bestbuy-status.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update retailer pickup status'
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            git push origin HEAD:main && exit 0
          done
          exit 1
