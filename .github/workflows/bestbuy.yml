name: Check Best Buy NY NJ
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: bestbuy-stock
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python retailers/BestBuyDuoStockChecker/monitor.py
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
      - name: Save status
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add retailers/BestBuyDuoStockChecker/status.json
          git diff --cached --quiet || (git commit -m 'Update Best Buy status' && git push)
