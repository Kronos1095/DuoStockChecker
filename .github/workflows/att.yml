name: Check AT&T NY NJ
on:
  workflow_dispatch:
  push:
    paths:
      - 'retailers/ATTduoStockChecker/**'
      - '.github/workflows/att.yml'
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: att-stock
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test response parsing
        run: python -m unittest discover -s retailers/ATTduoStockChecker -v
      - name: Check AT&T pickup
        run: python retailers/ATTduoStockChecker/monitor.py
      - name: Publish results
        if: always()
        run: |
          if [ ! -f docs/att-status.json ]; then exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/att-status.json
          git diff --cached --quiet || (git commit -m 'Update AT&T pickup status' && git push)
